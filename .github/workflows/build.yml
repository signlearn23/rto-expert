name: Build RTO Expert

# Runs on every push/PR to main for quick feedback (debug APK),
# and builds signed-ready release artifacts when you push a version tag
# like "v1.0.0".
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
permissions:
  contents: write
  

env:
  # Flutter 3.44 is current stable as of Sep 2026. Run `flutter --version`
  # locally and match it here so CI builds behave identically to your dev
  # machine. Note: Flutter 3.44 moved Android templates to AGP 9 — if your
  # android/ folder predates this, see the AGP 9 migration note below.
  #
  # Google Play requires targetSdk/compileSdk 36 (Android 16) for new
  # apps/updates as of Aug 31 2026 — confirm android/app/build.gradle sets
  # both to 36 (see android_sdk_version.md). App targets minSdk 28
  # (Android 9.0+) as the device floor.
  FLUTTER_VERSION: "3.44.0"

jobs: 
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart code
        run: dart format .

      - name: Commit formatting changes
        run: | 
               git config user.name "github-actions[bot]"
               git config user.email "41898282+github-action[bot]@users.noreply.github.com"
               if [[ -n "$(git status --porcelain)" ]]; then 
                 git add .
                 git commit -m "chore: format Dart code"
                 git push
               else
                 echo "No formatting changes."
               fi
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Debug - list mipmap resources
        run: |
          echo "--- mipmap folders ---"
          find android/app/src/main/res -iname "*mipmap*" -o -iname "ic_launcher*"
          echo "--- gitignore matches ---"
          grep -i -E "mipmap|\.png|icon" .gitignore || echo "no matches"

  build_debug_apk:
    name: Build Debug APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Java (required by Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar is a binary file, so it isn't checked into the
      # repo — this regenerates it fresh on every run to match
      # gradle/wrapper/gradle-wrapper.properties (Gradle 8.11).
      - name: Generate Gradle wrapper jar
        uses: gradle/actions/setup-gradle@v4
      - run: gradle wrapper --gradle-version 9.7.1
        working-directory: android

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rto-expert-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build_release:
    name: Build Release APK + AAB
    needs: analyze_and_test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Java (required by Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Gradle wrapper jar
        uses: gradle/actions/setup-gradle@v4
      - run: gradle wrapper --gradle-version 8.11
        working-directory: android

      # --- Signing setup ---
      # Add these as repo Settings > Secrets and variables > Actions > Secrets:
      #   KEYSTORE_BASE64      base64 of your release .jks/.keystore file
      #   KEYSTORE_PASSWORD    keystore password
      #   KEY_ALIAS            key alias
      #   KEY_PASSWORD         key password
      # Generate the base64 locally with:
      #   base64 -i release-key.jks | pbcopy   (macOS)
      #   base64 -w0 release-key.jks            (Linux)
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks

      - name: Write key.properties
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-key.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB (for Play Store upload)
        run: flutter build appbundle --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rto-expert-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: rto-expert-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
